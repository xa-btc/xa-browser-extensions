<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>XA Refresh</title><link rel="stylesheet" href="style.css"></head><body>
<header><img src="icons/48.png" alt=""><h1>XA Refresh</h1><button id="center">Control center</button></header>
<p id="site"></p><form id="config">
<label>Refresh schedule<select name="mode"><option value="fixed">Fixed interval</option><option value="random">Random interval</option><option value="once">Refresh once</option></select></label>
<div class="pair"><label>Interval (seconds)<input name="seconds" type="number" min="1" value="60" required></label><label id="range" hidden>Maximum (seconds)<input name="max" type="number" min="1" value="120"></label></div>
<div id="presets"><button type="button">5s</button><button type="button">15s</button><button type="button">30s</button><button type="button">60s</button><button type="button">5m</button></div>
<details><summary>Schedule options</summary><label>First refresh at<input type="datetime-local" name="at"></label><label>Stop after this many refreshes (0 = unlimited)<input type="number" min="0" value="0" name="limit" required></label><label><input type="checkbox" name="hard"> Bypass browser cache</label><label><input type="checkbox" name="background"> Refresh only inactive tabs</label></details>
<label>Page monitor<select name="monitor"><option value="off">Off</option><option value="change">Content changes</option><option value="contains">Text is present</option><option value="absent">Text is absent</option><option value="appears">Element is present</option><option value="disappears">Element is absent</option></select></label>
<section id="watch" hidden><label id="term">Text<input name="keyword"></label><label>CSS selector<input name="selector" placeholder="Leave blank for the whole page"></label><label>Delay before checking (seconds)<input type="number" name="delay" min="0" value="0"></label><label><input type="checkbox" name="sensitive"> Match letter case</label><label><input type="checkbox" name="notify" checked> Desktop notification</label><label><input type="checkbox" name="focus"> Focus tab on detection</label><label><input type="checkbox" name="keep"> Continue refreshing after detection</label></section>
<div class="buttons"><button class="primary" id="start">Start refreshing</button><button type="button" id="stop" hidden>Stop</button></div></form><output id="status" aria-live="polite"></output><script src="popup.js"></script></body></html>
