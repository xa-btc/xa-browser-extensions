<!doctype html><html lang="en" class="dark"><head><meta charset="utf-8"><title>XA Volume</title><link rel="stylesheet" href="style.css"></head><body><header><img src="icons/48.png" alt=""><h1>XA Volume</h1><button id="settings">Settings</button></header><p id="site" class="site"></p><div class="bar"><label for="volume">Tab volume</label><span><input type="number" min="0" step="1" id="volume" aria-label="Volume percentage"> %</span></div><input type="range" min="0" step="1" id="level" aria-label="Tab volume"><div class="buttons"><button id="mute" aria-pressed="false">Mute</button><button id="reset">Reset to 100%</button></div><section id="others" hidden><h2>Other audio tabs</h2><ul id="tabs"></ul></section><small id="tip">Scroll to adjust volume. Hold Ctrl to change it by 1%.</small><output id="status" aria-live="polite"></output><script src="model.js"></script><script src="popup.js"></script></body></html>
